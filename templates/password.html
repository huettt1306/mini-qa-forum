{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}
{% block content %}
<h2>Đổi mật khẩu</h2>
<form method="post" class="col-md-6">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="form-label">Mật khẩu hiện tại</label><input type="password" name="old_password"
        class="form-control mb-3" required>
    <label class="form-label">Mật khẩu mới (ít nhất 8 ký tự)</label><input type="password" name="new_password"
        class="form-control mb-3" minlength="8" required>
    <label class="form-label">Nhập lại mật khẩu mới</label><input type="password" name="confirm_password"
        class="form-control mb-3" minlength="8" required>
    <button class="btn btn-primary">Đổi mật khẩu</button>
</form>
{% endblock %}
