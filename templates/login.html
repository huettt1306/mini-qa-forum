{% extends "base.html" %}
{% block title %}Đăng nhập - Diễn đàn THPT{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill text-primary fs-1"></i>
                    <h4 class="fw-bold mt-2">Cổng Đăng Nhập</h4>
                    <p class="text-muted small">Dành cho Giáo viên và Học sinh toàn trường</p>
                </div>
                <form method="POST" action="/login">
                    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tên đăng nhập (Username)</label>
                        <input type="text" name="username" class="form-control" placeholder="Ví dụ: gv0001 hoặc hs00001"
                            required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Đăng Nhập</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
